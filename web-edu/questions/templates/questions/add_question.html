{% extends 'questions/layout/base.html' %}
{% block content %}
<div class="col-8 new-question">
    <h2 class ="nq">New Question</h2>
    <div class = "title row mt-3">
        <h3 class = "col-2 ms-3">Title</h3>
        <div class = "col-8">
            <input type="text" class="form-control col-8">
        </div>
    </div>
    <div class = "medium mt-2">
        <div class = "text row mt-3">
        <h3 class = "col-2 ms-3">Text</h3>
        <div class = "col-8">
            <textarea class ="form-control"></textarea>
        </div>
        </div>
    </div>
    <div class ="tags mt-4 row">
        <h3 class = "col-2 ms-3">Tags</h3>
        <div class = "col-8">
            <input type="text" class="form-control col-8">
        </div>
    </div>
    <button class ="btn_ask">ASK!</button>
</div>
{% endblock %}
