{% load static %}
<!DOCTYPE html>
<head>
    <meta charset = "utf-8">
    <title>AskSage</title>
    <link rel="icon" type="image/png" href="{% static 'img/icon.png' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/my_style.css' %}">
</head>
<body>
    <header class="headsite">
    <div class = "container">
        <div class = "row">
            <div class = "col-3 mt-3">
                <div class = "row">
                <a href = "{% url 'index' %}" class = "star_text col-3">
                <img class = "star" src ="{% static 'img/star.png' %}" alt="Звездочка">
                </a>
                <div class ="col-6"><h1>AskSage</h1></div>
                </div>
                </div>
            <div class = "col-6 header-search">
                <svg class = "loupa_icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
                <input type="search" placeholder=" Мудрецы ждут твой запроc...">
                <a href = "{% url 'add_question' %}">
                    <button>ASK</button>
                </a>
            </div>
            <div class = "col-1 user-info">
                <img class = "user-avatar" src="{% static 'img/icon.png' %}" alt="Аватарка">
            </div>
            {% if user.is_authenticated %}
            <div class = "col-2 mt-2 head-user-actions">
                
                <h3>Dr. Pepper</h3>
                <a href ="{% url 'setings' %}"> Setings</a>
                <a class ="logout" href =""> Logout</a>
                </div>
                {% else %}
                <div class = "col-2 login-register">
                <a href ="{% url 'login' %}"> login</a>
                <a class ="register" href ="{% url 'reg' %}"> register</a>
            </div>
                {% endif %}
</div>
</div>    
</header>
    <main>
        <div class = "row">
        {% block content %}
        {% endblock %}
        <div class = "col-3 info">
            <h1>Popular Tags</h1>
            <div class = "Tags">
            <a href = "{% url 'tag' %}">bender1</a>
            <a href = "{% url 'tag' %}">bender2</a>
            <a href = "{% url 'tag' %}">bender3</a>
            <a href = "{% url 'tag' %}">bender4</a>
            <a href = "{% url 'tag' %}">bender5</a>
            <a href = "{% url 'tag' %}">bender6</a>
            <a href = "{% url 'tag' %}">bender6</a>
            <a href = "{% url 'tag' %}">bender6</a>
            <a href = "{% url 'tag' %}">bender6</a>
            </div>
            <h1>Best Members</h1>
            <div class = "members">
            <a href = "tag.html">member1</a>
            <a href = "tag.html">member2</a>
            <a href = "tag.html">member3</a>
            </div>
        </div>
        </div>
    </main>
</body>
